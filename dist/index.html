<!doctype html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#efefec">
  <meta name="description" content="走進柳宗元〈江雪〉的水墨山水。沿雪徑漫遊、登高望江，在風雪中發現一葉孤舟。">
  <title>江雪・雪境漫遊</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Ctext x='4' y='37' font-size='36' fill='%23545d59'%3E雪%3C/text%3E%3C/svg%3E">
  <link rel="preload" as="image" href="./assets/art-reference.png">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main id="experience">
    <canvas id="world" tabindex="0" aria-label="江雪三維探索世界；W A S D 移動，按住滑鼠拖曳環顧，E 互動，C 呼喚，Escape 暫停。"></canvas>
    <div class="paper-grain" aria-hidden="true"></div>
    <div class="vignette" aria-hidden="true"></div>

    <section id="intro" aria-labelledby="intro-title">
      <img class="intro-art" src="./assets/art-reference.png" alt="淡墨雪徑沿江而下，灰山隱入霧中，一位老翁在孤舟上垂釣。">
      <div class="intro-copy">
        <p class="eyebrow">唐 · 柳宗元</p>
        <h1 id="intro-title">江雪</h1>
        <p class="intro-subtitle">走入一片無人的山水</p>
        <button id="start" class="ink-button" disabled><span id="start-label">正在鋪開山水</span><span class="button-arrow" aria-hidden="true">↗</span></button>
        <button id="intro-help" class="text-button">操作方式 <span aria-hidden="true">＋</span></button>
        <p id="load-status" role="status">準備水墨世界中…</p>
      </div>
      <div class="intro-foot"><span>雪境漫遊</span><span>自由探索 · 不用趕路</span></div>
    </section>

    <div id="mist-transition" aria-hidden="true"></div>

    <div id="hud" hidden>
      <header class="topbar">
        <div class="wordmark"><span class="small-title">江雪</span><span class="wordmark-rule"></span><span id="location">山間雪徑</span></div>
        <nav aria-label="探索設定">
          <button id="sound" class="icon-button" aria-label="開啟環境聲" aria-pressed="false" title="環境聲">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4Z"/><path class="sound-waves" d="M15 8c2 2 2 6 0 8m3-11c4 4 4 10 0 14"/><path class="sound-mute" d="m16 9 5 6m0-6-5 6"/></svg>
          </button>
          <button id="fullscreen" class="icon-button" aria-label="全螢幕" title="全螢幕"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/></svg></button>
          <button id="help" class="icon-button" aria-label="操作說明" title="操作說明"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-1 .5-1 1-1 2M12 17v.1"/></svg></button>
          <button id="pause" class="icon-button" aria-label="暫停探索" title="暫停"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14M16 5v14"/></svg></button>
        </nav>
      </header>
      <div class="reticle" aria-hidden="true"></div>
      <p id="feedback" role="status" aria-live="polite"></p>
      <div class="bottom-bar">
        <p class="desktop-controls"><kbd>W A S D</kbd> 移動 <i></i> 拖曳環顧 <i></i> <kbd>E</kbd> 互動</p>
        <p class="touch-controls">左側移動 · 右側拖曳環顧</p>
        <div class="actions">
          <button id="interact" class="action-button" hidden><span id="interaction-label">輕碰松枝</span><kbd>E</kbd></button>
          <button id="call" class="action-button">呼喚 <kbd>C</kbd></button>
        </div>
      </div>
      <div id="joystick" aria-label="觸控移動搖桿"><div class="joystick-ring"></div><div id="joystick-thumb"></div></div>
    </div>

    <dialog id="menu" aria-labelledby="menu-title">
      <div class="menu-panel">
        <button id="close-menu" class="close-button" aria-label="關閉">×</button>
        <p class="eyebrow">江雪 · 雪境漫遊</p>
        <h2 id="menu-title">在山水間，慢慢走。</h2>
        <p class="menu-description">沿雪徑登高，或走向江岸。停一停，聽聽風雪。</p>
        <div class="instructions">
          <div><span>行走</span><p><kbd>W A S D</kbd> 或 <kbd>↑ ↓</kbd>；觸控使用左下搖桿</p></div>
          <div><span>環顧</span><p>按住畫面拖曳；<kbd>← →</kbd> 轉身</p></div>
          <div><span>互動</span><p>走近松樹或江岸，按 <kbd>E</kbd> 或畫面按鈕</p></div>
          <div><span>呼喚</span><p><kbd>C</kbd>；山谷只有回聲</p></div>
        </div>
        <button id="resume" class="ink-button">繼續漫遊 <span aria-hidden="true">↗</span></button>
        <div class="menu-links"><button id="restart" class="text-button">回到起點</button><button id="reference" class="text-button">觀看美術原圖</button></div>
      </div>
    </dialog>
    <dialog id="reference-dialog" aria-label="選定的美術原圖">
      <img src="./assets/art-reference.png" alt="選定的淡墨江雪美術原圖：近景留白，遠山較深灰，江上孤舟。">
      <button id="close-reference" class="close-button" aria-label="返回操作說明">×</button>
      <span class="reference-caption">美術基準 · 淡墨、留白、灰山與孤舟</span>
    </dialog>
    <noscript><p class="noscript">請開啟 JavaScript，以進入三維水墨世界。</p></noscript>
  </main>
  <script type="module" src="./main.js?v=0.3.0"></script>
</body>
</html>
